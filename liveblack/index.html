  <link rel="preload" href="/black2026/img/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 400 800; font-display: swap; src: url(/black2026/img/montserrat-latin.woff2) format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    :root { --preto: #000; --amarelo: #ffee00; --verde: #1e853a; --vermelho: #e5212b; --texto-suave: #cfc9c4; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--preto); color: #fff; font-family: Montserrat, system-ui, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
    img { display: block; max-width: 100%; }
    .data { background: var(--amarelo); color: #000; text-align: center; font-weight: 800; font-size: .95rem; letter-spacing: .04em; text-transform: uppercase; padding: 10px 16px; }
    main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 22px 16px 40px; text-align: center; }
    .marca { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto 22px; max-width: 420px; }
    .marca__logo { flex: 1 1 auto; min-width: 0; width: 100%; max-width: 260px; height: auto; }
    .marca__cabeca { flex: none; height: 58px; width: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
    .marca__cabeca--ci { height: 70px; }
    h1 { font-size: 1.5rem; line-height: 1.22; margin: 0 0 18px; font-weight: 800; }
    h1 em { font-style: normal; color: var(--amarelo); }
    /* player leve: só a capa até a pessoa tocar no play */
    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111 center / cover no-repeat; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); cursor: pointer; }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player__play { position: absolute; inset: 0; margin: auto; width: 76px; height: 54px; border: 0; border-radius: 14px; background: var(--vermelho); cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
    .player__play::before { content: ""; border-style: solid; border-width: 12px 0 12px 20px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 460px; margin: 22px auto 0; padding: 18px 16px; border: 0; border-radius: 999px; background: var(--verde); color: #fff; font: 800 1rem Montserrat, sans-serif; text-transform: uppercase; text-decoration: none; cursor: pointer; }
    .btn--yt { background: var(--vermelho); animation: pulse 2s infinite; }
    .btn svg { width: 26px; height: 26px; flex: none; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,33,43,.55); } 70% { box-shadow: 0 0 0 14px rgba(229,33,43,0); } }
    .ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--vermelho); margin-right: 8px; vertical-align: 1px; animation: pisca 1.2s infinite; }
    @keyframes pisca { 50% { opacity: .25; } }
    [hidden] { display: none !important; }
    /* aviso ao vivo */
    .pop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .pop__caixa { width: 100%; max-width: 380px; background: #111; border: 1px solid rgba(255,255,255,.14); border-radius: 22px; padding: 26px 20px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: entra .25s ease-out; }
    @keyframes entra { from { transform: scale(.94); opacity: 0; } }
    .pop__selo { display: inline-block; background: var(--vermelho); color: #fff; font-weight: 800; font-size: .8rem; letter-spacing: .08em; padding: 6px 12px; border-radius: 999px; margin-bottom: 14px; }
    .pop__titulo { margin: 0 0 8px; font-size: 1.35rem; font-weight: 800; line-height: 1.25; }
    .pop__texto { margin: 0; color: var(--texto-suave); font-size: 1rem; }
    .pop__texto .seg { display: inline-grid; place-items: center; width: 30px; height: 30px; margin: 0 2px; border-radius: 50%; background: var(--amarelo); color: #111; font-weight: 800; vertical-align: middle; }
    .pop .btn { margin-top: 18px; font-size: .95rem; }
    .pop__fechar { margin: 12px 0 0; background: none; border: 0; color: #8a857f; font: 600 .8rem Montserrat, sans-serif; text-decoration: underline; cursor: pointer; }
    footer { text-align: center; color: #666; font-size: .75rem; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
    @media (min-width: 700px) { h1 { font-size: 1.9rem; } }
  </style>
</head>
<body>
  <div class="data">Black Vitalícia · <span>5/11 às 19h</span></div>
  <main>
    <div class="marca">
      <img class="marca__cabeca marca__cabeca--ci" src="/black2026/img/cabeca-cilaine.webp" alt="Cilaine Rodrigues" width="69" height="87">
      <img class="marca__logo" src="/black2026/img/logo-escuro-600.webp" srcset="/black2026/img/logo-escuro-400.webp 400w, /black2026/img/logo-escuro-600.webp 600w" sizes="260px" alt="Black Vitalícia — Docis + Felipe Russo" width="1200" height="600" fetchpriority="high">
      <img class="marca__cabeca" src="/black2026/img/cabeca-felipe.webp" alt="Felipe Russo" width="71" height="96">
    </div>
    <h1 id="titulo">A <em>Black Vitalícia</em> começa hoje às 19h</h1>
    <div class="player" id="player" role="button" aria-label="Assistir ao vídeo">
      <button class="player__play" type="button" aria-label="Play"></button>
    </div>
    <a class="btn btn--yt" id="ir-live" href="#" hidden><span class="ponto" aria-hidden="true"></span>Assistir ao vivo no YouTube</a>
  </main>

  <div class="pop" id="aviso" role="dialog" aria-modal="true" aria-labelledby="aviso-titulo" hidden>
    <div class="pop__caixa">
      <span class="pop__selo"><span class="ponto" style="background:#fff" aria-hidden="true"></span>AO VIVO</span>
      <p class="pop__titulo" id="aviso-titulo">Estamos ao vivo agora!</p>
      <p class="pop__texto">Você vai para o YouTube em <span class="seg" id="seg">5</span> segundos</p>
      <a class="btn btn--yt" id="ir-pop" href="#">Clique aqui para ir agora</a>
      <button class="pop__fechar" id="fechar" type="button">Continuar nesta página</button>
    </div>
  </div>

  <footer>Copyright © 2026 - Todos os direitos reservados</footer>

  <script>
    // ===== Configuração =====
    const VIDEO_PLAYER = "LjwqMAUSznI";               // vídeo do player da página (troque aqui)
    const LIVE = "LjwqMAUSznI";                       // live do YouTube para onde o aviso manda
    const INICIO = new Date("2026-11-05T18:55:00-03:00"); // horário de Brasília
    const FIM = new Date("2026-11-05T21:00:00-03:00");
    const SEGUNDOS = 5;
    // ========================

    const $ = (id) => document.getElementById(id);
    const urlLive = "https://www.youtube.com/watch?v=" + LIVE;
    const ua = navigator.userAgent;
    const android = /Android/i.test(ua);
    const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPad novo se diz Mac

    // player: capa leve, o YouTube só carrega no clique
    const player = $("player");
    player.style.backgroundImage = "url(https://i.ytimg.com/vi/" + VIDEO_PLAYER + "/hqdefault.jpg)";
    player.addEventListener("click", () => {
      if (player.querySelector("iframe")) return;
      player.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + VIDEO_PLAYER + '?autoplay=1&playsinline=1&rel=0" title="Vídeo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    });

    // abre a live no app do YouTube (celular/tablet) ou no navegador (PC)
    function abrirLive() {
      if (window.fbq) fbq("trackCustom", "FoiParaLiveBlack2026");
      if (window.dataLayer) dataLayer.push({ event: "foi_para_live_black2026" });
      try { sessionStorage.setItem("liveblack_foi", "1"); } catch (e) {}
      setTimeout(() => {
        if (android) {
          // intent: abre o app; sem app, o próprio Android usa o link do navegador
          location.href = "intent://www.youtube.com/watch?v=" + LIVE + "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(urlLive) + ";end";
        } else if (ios) {
          let saiu = false;
          const marcar = () => { saiu = true; };
          document.addEventListener("visibilitychange", marcar, { once: true });
          window.addEventListener("pagehide", marcar, { once: true });
          location.href = "youtube://www.youtube.com/watch?v=" + LIVE;
          setTimeout(() => { if (!saiu && !document.hidden) location.href = urlLive; }, 1500); // sem app: abre no Safari
        } else {
          location.href = urlLive;
        }
      }, 250); // tempo para os eventos saírem
    }
    ["ir-live", "ir-pop"].forEach((id) => {
      const a = $(id);
      a.href = urlLive;
      a.addEventListener("click", (e) => { e.preventDefault(); abrirLive(); });
    });

    let timer = null;
    function mostrarAviso() {
      $("titulo").innerHTML = '<span class="ponto" aria-hidden="true"></span>Estamos <em>ao vivo</em> agora';
      $("ir-live").hidden = false;
      let jaFoi = false;
      try { jaFoi = !!sessionStorage.getItem("liveblack_foi"); } catch (e) {}
      if (jaFoi) return; // voltou do YouTube: fica só o botão, sem novo redirecionamento
      $("aviso").hidden = false;
      let s = SEGUNDOS;
      $("seg").textContent = s;
      timer = setInterval(() => {
        s--; $("seg").textContent = Math.max(s, 0);
        if (s <= 0) { clearInterval(timer); abrirLive(); }
      }, 1000);
    }
    $("fechar").addEventListener("click", () => { clearInterval(timer); $("aviso").hidden = true; try { sessionStorage.setItem("liveblack_foi", "1"); } catch (e) {} });

    function voltarNormal() { $("aviso").hidden = true; $("ir-live").hidden = true; clearInterval(timer); $("titulo").innerHTML = 'Assista à <em>Black Vitalícia</em>'; }

    // teste: ?aovivo=1 força o aviso fora do horário
    const forcar = new URLSearchParams(location.search).get("aovivo") === "1";
    const agora = Date.now();
    if (forcar || (agora >= INICIO && agora < FIM)) mostrarAviso();
    else if (agora < INICIO) setTimeout(mostrarAviso, INICIO - agora); // página aberta antes: o aviso aparece sozinho às 18:55
    else voltarNormal();
    if (!forcar && agora < FIM) setTimeout(voltarNormal, FIM - agora);
  </script>
</body>
</html>
