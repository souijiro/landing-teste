  <style>
    :root { --ouro: #eebf78; --verde: #56c04a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ouro); color: #000; font-family: Montserrat, system-ui, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
    img { display: block; max-width: 100%; }
    .topo { text-align: center; font-weight: 800; font-size: .95rem; padding: 12px 16px; letter-spacing: .02em; }
    main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; background: #000; padding: 8px 16px 40px; text-align: center; }
    .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 -8px; }
    .fotos img { width: 100%; height: auto; }

    .logo { display: inline-flex; flex-direction: column; align-items: flex-start; font-family: "Lilita One", "Arial Black", sans-serif; color: var(--ouro); line-height: .9; margin: 18px auto 30px; }
    .logo__l1 { display: flex; align-items: center; gap: .14em; font-size: 2.5rem; }
    .logo__l1 img { height: .92em; width: auto; }
    .logo__l2 { display: flex; align-items: center; gap: .18em; font-size: 2.85rem; }
    .logo__outline { color: transparent; -webkit-text-stroke: 1.6px var(--ouro); letter-spacing: .02em; }
    .logo__stars { display: flex; flex-direction: column; align-items: center; font-size: .25em; line-height: .9; font-family: system-ui, sans-serif; }

    h1 { color: var(--ouro); font-size: 2.2rem; font-weight: 800; margin: 0 0 34px; }
    .texto { color: var(--ouro); font-size: 1.15rem; line-height: 1.9; margin: 0 0 40px; }
    .texto mark { background: var(--ouro); color: #000; padding: 4px 6px; }
    .btn { display: block; width: 100%; padding: 20px 16px; border: 0; border-radius: 4px; background: var(--verde); color: #fff; font: 800 1.1rem Montserrat, sans-serif; text-transform: uppercase; text-decoration: none; cursor: pointer; animation: pulse 2s infinite; }
    .btn[aria-disabled="true"] { cursor: default; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(86,192,74,.6); } 70% { box-shadow: 0 0 0 14px rgba(86,192,74,0); } }
    .aviso { display: none; color: #ddd; font-size: .9rem; margin: 14px 0 0; }
    footer { text-align: center; font-size: .78rem; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
    @media (min-width: 640px) { .logo__l1 { font-size: 3rem; } .logo__l2 { font-size: 3.4rem; } }
  </style>
</head>
<body>
  <div class="topo">ESTAMOS QUASE LÁ</div>

  <main>
    <div class="fotos">
      <img src="/black2026/img/cilaine-circulo.webp" alt="Cilaine Rodrigues" width="773" height="900">
      <img src="/black2026/img/felipe-circulo.webp" alt="Felipe Russo" width="600" height="700">
    </div>

    <div class="logo" role="img" aria-label="Black Vitalícia 2026">
      <div class="logo__l1"><img src="/black2026/img/brigadeiro.webp" alt="" width="174" height="165">BLACK 2026</div>
      <div class="logo__l2"><span class="logo__outline">VITALÍCIA</span><span class="logo__stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></span></div>
    </div>

    <h1>Falta 1 passo:</h1>

    <p class="texto">Para receber a oferta especial <mark>exclusiva para alunos</mark> você precisa entrar no grupo do WhatsApp</p>

    <a class="btn" id="grupo" href="#">Entrar no grupo</a>
    <p class="aviso" id="aviso">O link do grupo será liberado em breve.</p>
  </main>

  <footer>Copyright © 2026 - Todos os direitos reservados</footer>

  <script>
    // Link do grupo de WhatsApp: preencher quando os grupos forem definidos.
    const GRUPO_URL = "";

    const btn = document.getElementById("grupo");
    if (GRUPO_URL) {
      btn.href = GRUPO_URL;
      btn.addEventListener("click", () => { if (window.fbq) fbq("trackCustom", "EntrouGrupoBlack2026"); });
    } else {
      btn.setAttribute("aria-disabled", "true");
      btn.addEventListener("click", (e) => { e.preventDefault(); document.getElementById("aviso").style.display = "block"; });
    }
  </script>
</body>
</html>
