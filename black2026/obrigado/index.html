  <style>
    :root { --amarelo: #ffee00; --verde: #2fa84f; --creme: #f5f1ec; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--creme); color: #111; font-family: Montserrat, system-ui, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
    img { display: block; max-width: 100%; }
    .topo { background: var(--amarelo); text-align: center; font-weight: 800; font-size: .9rem; padding: 12px 16px; letter-spacing: .08em; }
    .topo span { font-weight: 800; }
    main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; background: #0b0b0b; color: #fff; padding: 22px 16px 40px; text-align: center; }
    .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; max-width: 380px; margin: 0 auto; }
    .fotos img { width: 100%; height: auto; }
    .logo { width: 100%; max-width: 300px; height: auto; margin: 26px auto 28px; }
    h1 { font-size: 2rem; font-weight: 800; margin: 0 0 22px; }
    .texto { color: #cfc9c4; font-size: 1.08rem; line-height: 1.8; margin: 0 0 34px; }
    .texto mark { background: #fff; color: #111; padding: 3px 6px; border-radius: 4px; font-weight: 700; }
    .btn { display: block; width: 100%; padding: 20px 16px; border: 0; border-radius: 999px; background: var(--verde); color: #fff; font: 800 1.05rem Montserrat, sans-serif; text-transform: uppercase; text-decoration: none; cursor: pointer; animation: pulse 2s infinite; }
    .btn[aria-disabled="true"] { cursor: default; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(47,168,79,.55); } 70% { box-shadow: 0 0 0 14px rgba(47,168,79,0); } }
    .aviso { display: none; color: #cfc9c4; font-size: .9rem; margin: 14px 0 0; }
    footer { text-align: center; color: #666; font-size: .75rem; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }

    <a class="btn" id="grupo" href="#">Entrar no grupo</a>
    <p class="aviso" id="aviso">O link do grupo será liberado em breve.</p>
  </main>

  <footer>Copyright © 2026 - Todos os direitos reservados</footer>

  <script>
    // Link do grupo de WhatsApp: preencher quando os grupos forem definidos.
    const GRUPO_URL = "";

    const btn = document.getElementById("grupo");
    if (GRUPO_URL) {
      btn.href = GRUPO_URL;
      btn.addEventListener("click", () => { if (window.fbq) fbq("trackCustom", "EntrouGrupoBlack2026"); });
    } else {
      btn.setAttribute("aria-disabled", "true");
      btn.addEventListener("click", (e) => { e.preventDefault(); document.getElementById("aviso").style.display = "block"; });
    }
  </script>
</body>
